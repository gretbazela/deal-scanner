# Spyhopper deal scanner v2 settings
# Each search learns its own going price from eBay, so no price book to keep up.
# To add a search, copy a block under "watch" and change the words.

settings:
  min_profit: 25            # only alert at or above this profit
  max_cost_ratio: 0.5       # your cost per piece must be at most 50% of the going price
  fee_rate: 0.136           # eBay final value fee
  promo_rate: 0.05          # promoted listing fee
  fee_fixed: 0.40           # per order fee
  buyer_shipping: 8.00      # shipping you charge buyers (eBay takes fees on it)
  unknown_ship_in: 12.00    # assumed shipping to you when a listing shows calculated shipping
  min_seller_feedback: 25
  min_seller_percent: 97
  max_listing_age_hours: 24 # only Buy It Now listings newer than this
  auction_window_hours: 3   # auctions ending within this many hours
  category_id: "1059"       # eBay Men's Clothing
  max_lot_size: 40
  lot_piece_factor: 0.8     # lot pieces valued at 80% of a single (some are weaker)
  market_percentile: 0.3    # use the lower end of current asking prices...
  market_discount: 0.85     # ...minus 15%, since asking prices run above sold prices
  market_min_samples: 15
  market_refresh_hours: 24
  max_alerts_per_run: 20

# Skip any listing with these words in the title
exclude_words: [women, womens, ladies, girls, kids, youth, boys, toddler, baby, infant,
  replica, inspired, custom, reworked, mystery, reseller box, hat, cap, beanie, socks,
  polo bear, coogi]

# What to watch. condition: used, new, or any.
# must: every inner list needs one of its words in the title (optional)
# skip: extra words to skip for this search (optional)
watch:
  # BOARD SHORTS
  - {name: Hurley Phantom board shorts, query: hurley phantom board shorts, condition: any}
  - {name: Rip Curl board shorts, query: rip curl mirage board shorts, condition: any}
