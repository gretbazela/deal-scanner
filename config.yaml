  - {name: Volcom board shorts, query: volcom board shorts, condition: any}
  - {name: Birdwell board shorts, query: birdwell board shorts, condition: any}
  - {name: Patagonia Baggies, query: patagonia baggies shorts, condition: any, must: [[baggies]]}
  - {name: Vintage board shorts, query: vintage board shorts mens, condition: any, must: [[vintage, vtg, 80s, 90s]]}
  - {name: Deadstock board shorts, query: deadstock board shorts, condition: any, must: [[deadstock, nwt, new with tags, new old stock]]}

  # GOLF
