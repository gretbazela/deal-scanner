# Spyhopper deal scanner settings
# Edit this file on GitHub (pencil icon) to tune what the scanner looks for.

settings:
  min_profit: 25            # only alert on deals at or above this profit
  fee_rate: 0.136           # eBay final value fee
  fee_fixed: 0.40           # per order fee
  promo_rate: 0.05          # promoted listing fee on sold price
  buyer_shipping: 8.00      # average shipping you charge buyers (eBay takes fees on it)
  unknown_ship_in: 12.00    # assumed cost to ship to you when a listing shows calculated shipping
  min_seller_feedback: 10   # skip sellers with fewer ratings than this
  min_seller_percent: 97    # skip sellers under this positive feedback %
  max_listing_age_hours: 24 # ignore Buy It Now listings older than this
  auction_window_hours: 3   # auctions ending within this many hours
  category_id: "11450"      # Clothing, Shoes and Accessories

# Brand spellings. "ok" are correct names; "typo" are common misspellings.
# Listings that use a typo get flagged "misspelled" (buyers miss those).
brands:
  carhartt: {ok: [carhartt], typo: [carhart, carharrt, carhatt, charhartt, carhardt]}
  patagonia: {ok: [patagonia], typo: [patagonai, patagnia, pategonia, patigonia, patagona, patagoina, patogonia, pattagonia, patagucci]}
  ralph lauren: {ok: [ralph lauren], typo: [ralp lauren, ralh lauren, rlaph lauren, ralph loren, ralph lauran, raplh lauren]}
  rrl: {ok: [rrl, double rl], typo: [double r l]}
  arcteryx: {ok: ["arc'teryx", arcteryx], typo: [arcterix, arc teryx, arcterx, arcteryz]}
  the north face: {ok: [the north face, north face, tnf], typo: [norht face, north fase, nort face]}
  harley davidson: {ok: [harley davidson], typo: [harly davidson, harley davidsen, harley davison]}
  filson: {ok: [filson], typo: [fillson, filsen]}
  barbour: {ok: [barbour], typo: [barbor, barber waxed]}
  schott: {ok: [schott], typo: [shott, schot]}
  levis: {ok: ["levi's", levis, levi], typo: [levies, leviss]}
  brunello cucinelli: {ok: [brunello cucinelli, cucinelli], typo: [brunelo cucinelli, brunello cuccinelli, cuccinelli]}
  loro piana: {ok: [loro piana], typo: [loropiana, lora piana, loro pianna]}
  peter millar: {ok: [peter millar], typo: [peter miller, peter millr, peter miler]}
  visvim: {ok: [visvim], typo: [vis vim, visvin]}
  engineered garments: {ok: [engineered garments], typo: [engineered garmemts, engineered garmets, engineer garments, engineered garment]}
  kapital: {ok: [kapital], typo: [kapitol]}
  birdwell: {ok: [birdwell], typo: [birdwel, bird well, birdwells]}
  champion: {ok: [champion], typo: [champian, champio, champoin]}
  coogi: {ok: [coogi], typo: [cooggi, coogie]}
  burberry: {ok: [burberry, burberrys], typo: [burbery, burburry, burbury]}
  starter: {ok: [starter], typo: [stater jacket]}
  lululemon: {ok: [lululemon], typo: [lululemen, lulu lemon, lululemn, lulelemon]}

# Price book: what each item usually SELLS for on eBay (realistic median,
# not the best sale). Starting numbers come from the comps your hourly scan
# has checked. Update them with your own sold comps as you go.
