name: Fast scan

on:
  # Retired: replaced by hunt.yml (hunter.py). Manual runs only.
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: fast-scan
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python fast.py
      - name: Save deals already sent and market prices
        if: always()
        run: |
          git config user.name "deal-scanner"
          git config user.email "deal-scanner@users.noreply.github.com"
          git add seen.json market.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update seen deals and market prices"
          git pull --rebase --quiet || true
          git push || true
