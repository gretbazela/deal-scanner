name: Deal scan

on:
  schedule:
    # Daytime, 6 AM to midnight Pacific: every 30 minutes (times are UTC)
    - cron: "7,37 0-7,14-23 * * *"
    # Overnight, midnight to 6 AM Pacific: every hour
    - cron: "17 8-13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scanner.py
      - name: Save deals already sent and market prices
        if: always()
        run: |
          git config user.name "deal-scanner"
          git config user.email "deal-scanner@users.noreply.github.com"
          git add seen.json market.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update seen deals and market prices"
          git pull --rebase --quiet || true
          git push
