name: Deal scan

on:
  schedule:
    - cron: "*/20 0-7,14-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scanner.py
      - name: Save the list of deals already sent
        run: |
          git config user.name "deal-scanner"
          git config user.email "deal-scanner@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen deals"
          git push

