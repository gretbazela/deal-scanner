name: Hunt

on:
  schedule:
    # Backup start in case the run did not restart itself. Extra starts just wait in line.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so saving the alert log mid run can rebase
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hunt eBay
        id: hunt
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python hunter.py
      - name: Weekly scorecard
        if: always()
        run: python report.py >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save alert log
        if: always()
        run: |
          git config user.name "deal-scanner"
          git config user.email "deal-scanner@users.noreply.github.com"
          git add alerts.csv seen.json state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update alert log"
          git pull --rebase --quiet || true
          git push || true
      - name: Start the next run
        if: success() && steps.hunt.outputs.restart != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hunt.yml
      - name: Tell my phone if the Hunt crashed
        if: failure() && steps.hunt.outcome == 'failure'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MSG=$(printf '%s\n\n%s\n%s' \
            "The Hunt crashed and is not looking for deals. It will try again on its own within 2 hours." \
            "WHAT TO DO" \
            "Tap this message, open the red run, and send Claude the error line. If it keeps failing, nothing to fix on your side.")
          curl -s -H "Title: Deal Scanner stopped" -H "Priority: 4" -H "Tags: warning" \
            -H "Click: https://github.com/${{ github.repository }}/actions/workflows/hunt.yml" \
            -d "$MSG" "https://ntfy.sh/${NTFY_TOPIC}" || true
