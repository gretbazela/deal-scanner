# Spyhopper buy list
#
# Each item below is something that reliably sells on eBay for $50+.
# An item is OFF until you fill in its sold price from Terapeak:
#   sold: {used: 85}            -> watches used listings, assumes they resell for $85
#   sold: {used: 85, new: 140}  -> watches both, new-with-tags valued at $140
# Leave a value blank (or delete it) to skip that condition.
# Draft prices came from DRAFT_PRICES.md (Actions -> Draft prices refreshes it).
# Run `python buylist.py` to see each item's Terapeak link and the most you can pay.
#
# Groups and costs:
#   groups:    named sets of costs shared by many items (for example "shorts"). Give an item
#              group: shorts and it uses that group's costs.
#   costs:     on a group or a single item. Overrides the settings below for just that item.
#              Allowed: target_profit, fee_rate, promo_rate, fee_fixed, buyer_shipping,
#              postage_out, buy_tax_rate, unknown_ship_in, typical_ship_in, lot_piece_factor,
#              max_lot_size, lot_buyer_shipping, lot_postage_out
#              (an item's own costs beat its group's, which beat settings)
#
# Optional per item:
#   must:  every inner list needs one of its words in the title
#   skip:  extra words that rule a listing out
#   typos: misspellings to search for separately (cheap listings hide behind these)
#   lots:  true also watches lots ("lot of 3") valued at lot_piece_factor of a single
#   note:  anything you want to remember (not used by the scanner)

settings:
  target_profit: 20         # only alert when estimated profit is at least this
  fee_rate: 0.136           # eBay final value fee (applies to item + shipping you charge)
  promo_rate: 0.05          # promoted listing fee, set 0 if you don't promote
  fee_fixed: 0.40           # per order fee
  buyer_shipping: 10.00     # shipping you charge the buyer
  postage_out: 10.00        # what the label actually costs you
  buy_tax_rate: 0.08        # sales tax eBay adds when you buy
  unknown_ship_in: 12.00    # shipping to you when a listing shows calculated shipping
  min_seller_feedback: 5
  min_seller_percent: 95
  max_listing_age_hours: 48 # Buy It Now listings newer than this
  auction_hours: 3          # auctions ending within this many hours
  lot_piece_factor: 0.8     # each piece in a lot is worth this share of a single
  max_lot_size: 20
  daily_call_budget: 4500   # eBay allows 5,000 searches a day; leave headroom

# Skip any listing with these words in the title
exclude_words: [women, womens, ladies, girls, kids, youth, boys, toddler, baby, infant,
  replica, inspired, custom, reworked, mystery, dupe, similar to, look alike, lookalike,
  unbranded, no brand]

# Skip listings that admit damage
damage_words: [for parts, as is, damaged, stain, stained, stains, holes, ripped, torn, flawed]

# Cost sets shared by groups of items. Anything not listed here uses settings above.
groups:
  shorts:
    costs:
      typical_ship_in: 7      # what you usually pay to have a pair shipped to you
      unknown_ship_in: 7      # the guess when a listing shows calculated shipping
      buyer_shipping: 6.50    # what you charge the buyer (you said $6 to $7)
      postage_out: 7.00       # your label cost for one pair
      promo_rate: 0.05        # you promote shorts at about 5%
      target_profit: 10       # shorts clear $10 profit (chosen 11/24/2026); everything else stays at $20
      # Lots ship as one parcel. Add these two once you know the numbers, then lots stop being
      # charged shipping and the order fee once per pair:
      # lot_buyer_shipping: 0
      # lot_postage_out: 0

